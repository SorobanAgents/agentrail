<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Border Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glyph 3D Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle (22% radius = 110px on 500px) -->
  <rect x="15" y="15" width="470" height="470" rx="103" ry="103" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Inner Ambient Glow -->
  <circle cx="250" cy="220" r="160" fill="url(#centerGlow)" />

  <!-- Cyber Grid Circuit Lines -->
  <path d="M 120 100 L 170 100 L 200 130" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
  <circle cx="200" cy="130" r="3" fill="#e2e8f0" fill-opacity="0.6" />
  <path d="M 380 100 L 330 100 L 300 130" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
  <circle cx="300" cy="130" r="3" fill="#e2e8f0" fill-opacity="0.6" />

  <!-- 3D Isometric AI Hex-Shield -->
  <polygon points="250,110 340,165 340,275 250,330 160,275 160,165" fill="#0f172a" stroke="#e2e8f0" stroke-width="3" stroke-linejoin="round" />
  <!-- Inner Facets -->
  <polygon points="250,110 340,165 250,220" fill="url(#glyphGrad)" fill-opacity="0.15" />
  <polygon points="160,165 250,110 250,220" fill="url(#glyphGrad)" fill-opacity="0.3" />
  <polygon points="160,165 160,275 250,220" fill="url(#glyphGrad)" fill-opacity="0.2" />
  <polygon points="340,165 340,275 250,220" fill="url(#glyphGrad)" fill-opacity="0.1" />
  <polygon points="160,275 250,330 250,220" fill="url(#glyphGrad)" fill-opacity="0.4" />
  <polygon points="340,275 250,330 250,220" fill="url(#glyphGrad)" fill-opacity="0.25" />

  <!-- Center Core Node -->
  <circle cx="250" cy="220" r="16" fill="#e2e8f0" />
  <circle cx="250" cy="220" r="8" fill="#ffffff" />

  <!-- Typography / Badging -->
  <text x="250" y="375" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#e2e8f0" text-anchor="middle" letter-spacing="4">SILVER</text>
  <text x="250" y="405" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="2">SEP-50 SOULBOUND VERIFIED</text>
  
  <!-- Score Badge Pill -->
  <rect x="180" y="422" width="140" height="26" rx="13" ry="13" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="250" y="440" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">REPUTATION 75/100</text>
</svg>