[package]
name = "agentrail-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Soroban Smart Contract for AgentRail Scoped Allowances & AI Agent Escrow"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.2"

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
